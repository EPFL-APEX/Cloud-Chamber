[package]
name = "cloud-chamber-firmware"
version = "0.1.0"
edition = "2021"
build = "build.rs"
# Binaires déclarés explicitement : les binaires de test de la branche équipe
# (test_breaker, test_closure, ...) restent dans src/bin/ mais dépendent des
# modules cloud_chamber_hal/drivers pas encore réactivés — ils seront ajoutés
# ici au fur et à mesure de la convergence.
autobins = false

[lib]
name = "cloud_chamber_firmware"

[[bin]]
name = "main"
path = "src/bin/main.rs"

[[bin]]
name = "i2c_scan"
path = "src/bin/i2c_scan.rs"

[[bin]]
name = "test_control"
path = "src/bin/test_control.rs"

[[bin]]
name = "test_display"
path = "src/bin/test_display.rs"

[[bin]]
name = "test_screen"
path = "src/bin/test_screen.rs"

[dependencies]
# HAL RP2040 — Rust stable, pas d'Embassy
rp2040-hal    = { version = "0.10", features = ["rt", "critical-section-impl"] }
rp2040-boot2  = "0.3"

# 1-Wire / DS18B20 (même crate que le projet partenaire)
onewire = "0.4"

# USB CDC série sans Embassy
usb-device  = "0.3"
usbd-serial = "0.2"

# Traits HAL embarqués (bloquants)
embedded-hal = "1.0"

# Cortex-M runtime
cortex-m    = { version = "0.7" }
cortex-m-rt = "0.7"

# Synchronisation no_std (remplace embassy_sync)
critical-section = "1.1"

# Utilitaires
heapless   = "0.8"
defmt      = "0.3"
defmt-rtt  = "0.4"
panic-halt = "0.2"

mipidsi           = "0.9"
embedded-graphics = "0.8"
embedded-hal-bus  = "0.2"
portable-atomic   = { version = "1", features = ["critical-section"] }
libm              = "0.2"

# ── Dépendances de la branche équipe, à réintroduire avec leurs modules ──────
# (cloud_chamber_hal / drivers / ui — cf. lib.rs, plan de convergence)
# embedded-time = "0.12.1"
# embedded-charts = { version = "0.3.0", default-features = false, optional = true }
# tinybmp = "0.7.0"
# ili9341 = "0.6"
# num_enum = { version = "0.7", default-features = false }
# rp235x-hal (RP2350) : à réintroduire avec le build.rs multi-cibles

[profile.release]
debug     = 2
lto       = true
opt-level = "s"
