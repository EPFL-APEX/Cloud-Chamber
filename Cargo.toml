
[package]
edition = "2024"
name = "Cloud-Chamber"
version = "0.1.0"

autobins = false

[lib]
name = "cloud_chamber_firmware"

[build-dependencies]
regex = "1.13"

[features]
charts = ["dep:embedded-charts"]
# Active la fenêtre SDL2 de embedded-graphics-simulator pour le test
# interactif `main_menu_live` (src/ui/screens/menu.rs) — nécessite SDL2
# installé sur la machine de compilation.
live-menu-test = ["embedded-graphics-simulator/with-sdl"]
usb-comm = []
# N'active rien à elle seule — sert uniquement de garde via `required-features`
# sur `[[bin]] identify_temp_sensors` (RP2040 uniquement), pour que les jobs
# CI `cargo check` sur les autres cibles ne tentent pas de le construire.
bin-identify-temp-sensors = []

# N'active rien à elle seule — sert uniquement de garde via `required-features`
# sur `[[bin]] blinky` (RP2040 uniquement), pour que les jobs CI
# `cargo check` sur les autres cibles ne tentent pas de le construire.
bin-blinky = []

# N'active rien à elle seule — sert uniquement de garde via `required-features`
# sur `[[bin]] relay_test` (RP2040 uniquement), pour que les jobs CI
# `cargo check` sur les autres cibles ne tentent pas de le construire.
bin-relay-test = []

# N'active rien à elle seule — sert uniquement de garde via `required-features`
# sur `[[bin]] encoder_test` (RP2040 uniquement), pour que les jobs CI
# `cargo check` sur les autres cibles ne tentent pas de le construire.
bin-encoder-test = []

[[bin]]
name = "identify_temp_sensors"
path = "src/bin/identify_temp_sensors.rs"
required-features = ["bin-identify-temp-sensors"]

[[bin]]
name = "blinky"
path = "src/bin/blinky.rs"
required-features = ["bin-blinky"]

[[bin]]
name = "relay_test"
path = "src/bin/relay_test.rs"
required-features = ["bin-relay-test"]

[[bin]]
name = "encoder_test"
path = "src/bin/encoder_test.rs"
required-features = ["bin-encoder-test"]

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = "1.0"
embedded-time = "0.12"
defmt = "1.1"
defmt-rtt = "1.3"
# Partage de données inter-cœurs sans allocation heap
critical-section = "1.1"
heapless = "0.9"
# Bibliothèque de rendu graphique embarqué (no_std, trait DrawTarget)
embedded-graphics = "0.8"
embedded-charts = { version = "0.3.0", default-features = false, features = ["floating-point", "animations", "color-support"], optional = true}
tinybmp = "0.7.0"
ili9341 = "0.6"

# Données
num_enum = { version = "0.7", default-features = false }


#Kynan dep
mipidsi           = "0.10"
embedded-hal-bus  = "0.3"
portable-atomic   = { version = "1", features = ["critical-section"] }
libm              = "0.2"

# USB CDC série sans Embassy
usb-device  = "0.3"
usbd-serial = "0.2"
panic-halt = { version = "1.0.0" }

[dev-dependencies]
# Simulation de l'afficheur ILI9341 sur desktop pour tester l'UI sans matériel.
# default-features = false → pas besoin de SDL2 pour les tests unitaires.
# Pour la fenêtre SDL2 live : activer la feature du projet "live-menu-test"
embedded-graphics-simulator = { version = "0.8", default-features = false }

# Fournit une implémentation de critical_section basée sur std::sync::Mutex
# pour les builds sur desktop (cargo test, cargo run --example).
# Sur les cibles embarquées, cette entrée est ignorée (cfg non satisfait).
[target.'cfg(not(any(target_arch = "arm", target_arch = "riscv32")))'.dev-dependencies]
critical-section = { version = "1.1", features = ["std"] }

[target.'cfg( target_arch = "arm" )'.dependencies]
panic-probe = { version = "1", features = ["print-defmt"] }
pio = "0.3"

[target.'cfg( target_arch = "riscv32" )'.dependencies]
pio = "0.3"

[target.thumbv6m-none-eabi.dependencies]
rp2040-boot2 = "0.3"
rp2040-hal = { version = "0.12", features = ["rt", "critical-section-impl"] }
usb-device = "0.3"
usbd-serial = "0.2"

[target.riscv32imac-unknown-none-elf.dependencies]
rp235x-hal = { version = "0.4", features = ["rt", "critical-section-impl"] }

[target."thumbv8m.main-none-eabihf".dependencies]
rp235x-hal = { version = "0.4", features = ["rt", "critical-section-impl"] }

[profile.release]
debug     = 2
lto       = true
opt-level = "s"
