# Configuration cargo — cible RP2040 (Pico W), version validée sur matériel.
#
# NOTE convergence : le template rp-hal de la branche équipe (multi-cibles
# RP2040/RP2350, linker flip-link, runners picotool/probe-rs) est conservé
# dans l'historique git. flip-link (protection anti-débordement de pile) est
# une bonne idée à réintroduire plus tard — il nécessite `cargo install
# flip-link` sur chaque poste de dev.

[build]
target = "thumbv6m-none-eabi"

[target.thumbv6m-none-eabi]
runner = "elf2uf2-rs"
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
]
